name: Build all OT Sense images
# Upload os-source.zip (folders otsense-os/ and sensor-src/ inside) to the root of the repo, then Actions > this workflow > Run workflow.
# New in this build: every image has a REMOTE ACCESS (SRA) port - choose it on the sensor screen (button "Remote access port (SRA)" / key S),
# give it its own fixed IP and optional VLAN; engineer sessions started from central then leave through that port only.
# New in this build: the sensor software 2.9 (updates sent from central survive a reboot of the ISO/OVA, "Undo software update", update progress bar,
# sensor screen that fits the display) and the Windows app (.exe) is built here as well, in the same run.
# New in this build: the sensor as a CONTAINER (Docker image, amd64 + arm64) - for any Linux machine with Docker. Built, smoke-tested (the sensor starts and
# answers on its web page inside the container) and attached to the release as otsense-sensor-container-amd64.tar.gz / -arm64.tar.gz
# (offline: docker load -i ...). Optionally pushed to GitHub's registry too: ghcr.io/<owner>/otsense-sensor:<sensor version> and :latest.
# Normal installs do NOT need the registry: central builds the container itself from sensor-src/container (one-line installer in the console).
# Result: a GitHub Release with otsense-sensor.img (x86 disk: Hyper-V / KVM / PC), otsense-sensor-rpi.img.xz (Raspberry Pi SD card),
# otsense-sensor.iso (x86 live ISO: bare metal USB, any hypervisor), otsense-sensor.ova (ready-made VM: VMware, VirtualBox)
# and OTSense-Sensor.exe (Windows app, no VM) + OTSense-Sensor-console.exe (same program with a text window).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release with the images"
        type: boolean
        default: true
      containerised:
        description: "Build the ISO / OVA / PC disk / Raspberry Pi images with the sensor running INSIDE a Docker container (recommended)"
        type: boolean
        default: true
      push_registry:
        description: "Also push the sensor container to GitHub's container registry (ghcr.io)"
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
jobs:
  build:
    needs: [container]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the sources
        run: |
          set -e
          [ -f os-source.zip ] || { echo "os-source.zip is missing in the repo root"; exit 1; }
          mkdir -p _src && unzip -q os-source.zip -d _src
          test -f _src/otsense-os/build-image.sh
          test -f _src/sensor-src/otsense.py
      - name: Offline tests (boot logic + remote access (SRA) port)
        run: PYTHONDONTWRITEBYTECODE=1 python3 _src/otsense-os/tests/test_prep.py
      - name: Check the sensor program carries the SRA binding
        run: |
          grep -q 'OTSENSE_SRA_IP' _src/sensor-src/otsense.py
          test -f _src/otsense-os/overlay/opt/otsense/otsense-sra.py
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true; df -h /
      - uses: actions/download-artifact@v4
        if: ${{ inputs.containerised }}
        with:
          name: otsense-container-${{ matrix.arch }}
          path: _ct
      - name: Use the sensor container inside the image
        if: ${{ inputs.containerised }}
        run: |
          f=$(ls "$PWD"/_ct/otsense-sensor-container-${{ matrix.arch }}.tar.gz); test -s "$f"
          echo "CONTAINER_TAR=$f" >> "$GITHUB_ENV"; ls -lh "$f"
      - name: Build image (${{ matrix.arch }})
        run: sudo -E bash _src/otsense-os/build-image.sh ${{ matrix.arch }} "$PWD/_src/sensor-src" "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: otsense-os-${{ matrix.arch }}
          path: out/*
          compression-level: 0
  iso-ova:
    needs: [container]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the sources
        run: |
          set -e
          [ -f os-source.zip ] || { echo "os-source.zip is missing in the repo root"; exit 1; }
          mkdir -p _src && unzip -q os-source.zip -d _src
          test -f _src/sensor-image/build-iso.sh
          test -f _src/otsense-os/make-ova.sh
          test -f _src/sensor-src/otsense.py
          test -f _src/sensor-image/iso/otsense-sra.py
      - name: Dry-run the remote access (SRA) port on the ISO screen logic
        run: |
          set -e
          mkdir -p /tmp/st /tmp/rn
          echo '{"port":"eth2","vlan":100,"ip_cidr":"10.30.0.9/24","gateway":"10.30.0.1"}' > /tmp/st/sra.json
          export DRY_RUN=1 NICS="eth0 eth1 eth2" STATE=/tmp/st RUN=/tmp/rn D="$PWD/_src/sensor-image/iso"
          python3 "$D/otsense-console.py" --ports | tee /tmp/ports.txt
          grep -q "^SRA=eth2" /tmp/ports.txt && grep -q "^CAP=eth1$" /tmp/ports.txt
          python3 "$D/otsense-console.py" --net | grep -q "ip link add link eth2 name sra100 type vlan id 100"
          grep -q "OTSENSE_SRA_IP=10.30.0.9" /tmp/rn/sra.env
      - uses: actions/download-artifact@v4
        if: ${{ inputs.containerised }}
        with:
          name: otsense-container-amd64
          path: _ct
      - name: Use the sensor container inside the image
        if: ${{ inputs.containerised }}
        run: |
          f=$(ls "$PWD"/_ct/otsense-sensor-container-amd64.tar.gz); test -s "$f"
          echo "CONTAINER_TAR=$f" >> "$GITHUB_ENV"; ls -lh "$f"
      - name: Build the sensor ISO (inside a Debian 12 container)
        run: sudo -E OUT_DIR="$PWD/out" bash _src/sensor-image/docker-build.sh iso-amd64 "$PWD/_src/sensor-src"
      - name: Check the ISO has the graphical screen, text screen and sensor
        run: sudo -E bash _src/sensor-image/ci-check.sh out/otsense-sensor.iso
      - name: Wrap the ISO into an OVA (ready-made VM, 4 ports)
        run: |
          sudo chown -R "$(id -u):$(id -g)" out      # the ISO step ran as root inside Docker
          bash _src/otsense-os/make-ova.sh out/otsense-sensor.iso out/otsense-sensor.ova
      - uses: actions/upload-artifact@v4
        with:
          name: otsense-iso-ova
          path: out/*
          compression-level: 0
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the sources
        shell: pwsh
        run: |
          if (-not (Test-Path os-source.zip)) { throw "os-source.zip is missing in the repo root" }
          Expand-Archive -Path os-source.zip -DestinationPath _src -Force
          if (-not (Test-Path _src/sensor-src/otsense.py)) { throw "sensor-src/otsense.py is not inside os-source.zip" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller scapy
      - name: Check the program (syntax and window libraries)
        shell: pwsh
        run: |
          python -c "import ast,sys; ast.parse(open('_src/sensor-src/otsense.py',encoding='utf8').read()); import tkinter, scapy; print('ok')"
      - name: Build OTSense-Sensor.exe (window, one file - Python and scapy are inside)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OTSense-Sensor --collect-submodules scapy --hidden-import tkinter _src/sensor-src/otsense.py
      - name: Build OTSense-Sensor-console.exe (same program, text window for run / install / ifaces)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --console --name OTSense-Sensor-console --collect-submodules scapy --hidden-import tkinter _src/sensor-src/otsense.py
      - name: Smoke test (the console build answers)
        shell: pwsh
        run: |
          ./dist/OTSense-Sensor-console.exe --help | Select-Object -First 5
      - uses: actions/upload-artifact@v4
        with:
          name: otsense-windows
          path: dist/*.exe
          compression-level: 0
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the sources
        run: |
          set -e
          [ -f os-source.zip ] || { echo "os-source.zip is missing in the repo root"; exit 1; }
          mkdir -p _src && unzip -q os-source.zip -d _src
          test -f _src/sensor-src/otsense.py
          test -f _src/sensor-src/container/Dockerfile
          test -f _src/sensor-src/container/entrypoint.sh
          mkdir -p _ctx && cp _src/sensor-src/container/Dockerfile _src/sensor-src/container/entrypoint.sh _src/sensor-src/otsense.py _ctx/
          VER=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' _src/sensor-src/otsense.py | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Sensor program version: $VER"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the container (${{ matrix.arch }})
        run: docker buildx build --platform linux/${{ matrix.arch }} --load -t otsense-sensor:ci _ctx
      - name: Smoke test 1 - the program starts inside the container
        if: ${{ matrix.arch == 'amd64' }}
        run: docker run --rm otsense-sensor:ci cli --help | head -5
      - name: Smoke test 2 - the sensor runs and its web page answers (host network, loopback capture)
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -e
          docker run -d --name otsense-ci --network host --cap-add NET_RAW --cap-add NET_ADMIN \
            -e OTSENSE_CENTRAL=http://127.0.0.1:9 -e OTSENSE_TOKEN=ci-test-token -e OTSENSE_SITE=ci -e OTSENSE_IFACE=lo -e OTSENSE_UI_PORT=18081 \
            otsense-sensor:ci sensor
          ok=0
          for i in $(seq 1 30); do
            if curl -sk -o /dev/null https://127.0.0.1:18081/; then ok=1; break; fi
            sleep 2
          done
          docker logs otsense-ci | tail -n 15
          [ "$ok" = 1 ] || { echo "the sensor web page did not answer"; exit 1; }
          docker exec otsense-ci sh -c 'test -f /data/sensor.json'
          docker rm -f otsense-ci
      - name: "Smoke test 3 - an update saved in the volume survives re-creating the container"
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -e
          cat > _t3.py <<'PYEOF'
          import re, os, sys
          sys.path.insert(0, "/opt/otsense")
          import otsense
          os.makedirs("/data/code", exist_ok=True)
          src = open("/opt/otsense/otsense.py").read()
          v = re.search(r'^VERSION = "([^"]+)"', src, re.M).group(1)
          open("/data/code/otsense.py", "w").write(src.replace('VERSION = "%s"' % v, 'VERSION = "999.0"', 1))
          open("/data/code/restore.py", "w").write(otsense.RESTORE_PY)
          print("saved a fake update 999.0 over", v)
          PYEOF
          docker volume create ci-data >/dev/null
          docker run --rm -v ci-data:/data -v "$PWD/_t3.py:/t3.py:ro" --entrypoint python3 otsense-sensor:ci /t3.py
          # a "new" container (fresh image) starts with the same volume: the start script must put the saved program back
          docker run --rm -v ci-data:/data --entrypoint sh otsense-sensor:ci -c 'python3 /data/code/restore.py /opt/otsense /data/code; grep -q "^VERSION = \"999.0\"" /opt/otsense/otsense.py && echo RESTORED-OK' | tee /tmp/r.txt
          grep -q RESTORED-OK /tmp/r.txt
      - name: "Save the container as a file (offline install: docker load -i ...)"
        run: |
          mkdir -p out
          docker tag otsense-sensor:ci otsense-sensor:current
          docker save otsense-sensor:current | gzip -9 > "out/otsense-sensor-container-${{ matrix.arch }}.tar.gz"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: otsense-container-${{ matrix.arch }}
          path: out/*
          compression-level: 0
  container-registry:
    if: ${{ inputs.push_registry }}
    needs: [container]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the sources
        run: |
          set -e
          mkdir -p _src && unzip -q os-source.zip -d _src
          mkdir -p _ctx && cp _src/sensor-src/container/Dockerfile _src/sensor-src/container/entrypoint.sh _src/sensor-src/otsense.py _ctx/
          echo "VER=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' _src/sensor-src/otsense.py | head -1)" >> "$GITHUB_ENV" echo "OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV" - uses: docker/setup-qemu-action@v3 - uses: docker/setup-buildx-action@v3 - uses: docker/login-action@v3 with: registry: ghcr.io username: ${{ github.actor }} password: ${{ secrets.GITHUB_TOKEN }} - name: Build and push (amd64 + arm64) run: | docker buildx build --platform linux/amd64,linux/arm64 --push \ -t "ghcr.io/$OWNER/otsense-sensor:$VER" -t "ghcr.io/$OWNER/otsense-sensor:latest" _ctx echo "Pushed ghcr.io/$OWNER/otsense-sensor:$VER  (packages are private until you make them public: GitHub > Packages > otsense-sensor > Package settings)" release: needs: [build, iso-ova, windows-exe, container] if: ${{ inputs.publish }} runs-on: ubuntu-24.04 steps: - uses: actions/download-artifact@v4 with: path: out merge-multiple: true - name: Publish release env: GH_TOKEN: ${{ github.token }} run: | ls -lh out gh release create "os-${{ github.run_number }}" out/* --repo "$GITHUB_REPOSITORY" \ --title "OT Sense OS build ${{ github.run_number }}" \ --notes "NEW: remote access (SRA) port on every image - on the sensor screen press Remote access port (SRA) / key S: choose a free wired port, give it a fixed IP (and VLAN); engineer sessions from central leave through it only. otsense-sensor.img(.gz) = x86-64 disk (Hyper-V / KVM / PC; a .gz is unpacked by central while it downloads). From this build the images run the sensor INSIDE a Docker container (Docker + the container are in the image; if the container cannot start the program runs directly as before). otsense-sensor.iso = x86-64 live ISO (bare metal USB, any hypervisor). otsense-sensor.ova = ready-made VM (VMware, VirtualBox). otsense-sensor-rpi.img.xz = Raspberry Pi 3/4/5 SD card. otsense-sensor-container-amd64.tar.gz / -arm64.tar.gz = the sensor as a Docker container (offline: docker load -i file.tar.gz; normally installed with the one-line command from central instead). OTSense-Sensor.exe = Windows app (no VM; put it in the base-images folder of central under windows/). Copy the release links into central > Sites > Base images."
